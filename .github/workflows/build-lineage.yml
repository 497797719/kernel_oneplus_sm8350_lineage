name: Build Lineage Kernel (lemonadep)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2-custom
          fetch-depth: 1

      - name: Apply custom patches
        run: |
          ls -la patches/ 2>/dev/null || echo "no patches dir"
          for p in patches/*.patch; do
            [ -f "$p" ] || continue
            echo "applying $p"
            git apply --check "$p" && git apply "$p" && echo "OK $p" || { echo "FAIL $p"; exit 1; }
          done

      - name: Setup clang (r416183b, LineageOS official)
        run: |
          git clone --depth 1 --branch lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          clang --version | head -2

      - name: Build kernel (lahaina-qgki)
        run: |
          # safety: make ./trace.h resolvable for WALT trace (see 0002 patch)
          ln -sf $PWD/kernel/sched/walt/trace.h include/trace/trace.h || true
          make ARCH=arm64 LLVM=1 CC=clang vendor/lahaina-qgki_defconfig
          make ARCH=arm64 LLVM=1 CC=clang -j$(nproc) Image.gz dtbs 2>&1 | tee build.log
          echo "--- outputs ---"
          ls -la arch/arm64/boot/Image.gz
          ls arch/arm64/boot/dts/vendor/qcom/*.dtb 2>/dev/null | head -20

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/vendor/qcom/
            build.log
