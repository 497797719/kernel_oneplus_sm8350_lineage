name: build-lineage-kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply custom patches
        run: |
          ls patches/
          for p in patches/*.patch; do
            echo "=== applying $p ==="
            git apply --verbose "$p" || { echo "PATCH FAILED: $p"; exit 1; }
          done
          git diff --stat | tail -5

      - name: Setup clang/lld toolchain (official Android toolchain family)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld llvm
          clang --version | head -1
          ld.lld --version | head -1

      - name: Build kernel (lahaina-qgki, clang+lld)
        run: |
          set -o pipefail
          # Trace include fixes (same quote-include issue for clang): see comments below.
          mkdir -p include/trace/events
          for f in $(find drivers kernel net sound fs arch include -name '*.h' 2>/dev/null); do
            if grep -q '^#define TRACE_INCLUDE_PATH[[:space:]]*\.' "$f" 2>/dev/null; then
              old=$(grep -m1 '^#define TRACE_INCLUDE_FILE[[:space:]]*[A-Za-z0-9_-]' "$f" 2>/dev/null | sed -E 's/^#define TRACE_INCLUDE_FILE[[:space:]]+([A-Za-z0-9_-]+).*/\1/' || true)
              if [ "$old" = "trace" ]; then
                sub=$(basename "$(dirname "$f")")
                sed -i "s/^#define TRACE_INCLUDE_FILE[[:space:]]*trace$/#define TRACE_INCLUDE_FILE $sub/" "$f"
                ln -sf "$PWD/$f" "include/trace/$sub.h" 2>/dev/null || true
              elif [ -n "$old" ]; then
                ln -sf "$PWD/$f" "include/trace/$old.h" 2>/dev/null || true
              fi
            elif grep -q '^#define TRACE_INCLUDE_FILE[[:space:]]*[A-Za-z0-9_-]' "$f" 2>/dev/null && ! grep -q '^#define TRACE_INCLUDE_PATH' "$f" 2>/dev/null; then
              name=$(grep -m1 '^#define TRACE_INCLUDE_FILE[[:space:]]*[A-Za-z0-9_-]' "$f" 2>/dev/null | sed -E 's/^#define TRACE_INCLUDE_FILE[[:space:]]+([A-Za-z0-9_-]+).*/\1/' || true)
              if [ -n "$name" ]; then
                ln -sf "$PWD/$f" "include/trace/events/$name.h" 2>/dev/null || true
              fi
            fi
          done
          # Remove -Werror (2019 kernel under modern clang fires many -Werror=*; KCFLAGS is overridden later)
          grep -rl -- '-Werror' --include='Makefile*' . 2>/dev/null | xargs sed -i -E 's/-Werror=[A-Za-z0-9_-]+//g; s/([[:space:]])-Werror([[:space:]])/\1\2/g; s/-Werror$//' 2>/dev/null || true
          export KCFLAGS="-Wno-error"
          make ARCH=arm64 LLVM=1 vendor/lahaina-qgki_defconfig
          echo "=== key config (must match stock) ==="
          grep -E "CONFIG_CC_IS_CLANG|CONFIG_CFI_CLANG|CONFIG_MODVERSIONS|CONFIG_MODULE_SIG|CONFIG_LOCALVERSION|CONFIG_LTO" .config
          cp .config arch/arm64/boot/kernel_config.txt
          make ARCH=arm64 LLVM=1 -j$(nproc) Image.gz dtbs 2>&1 | tee build.log
          echo "--- build outputs ---"
          ls -la arch/arm64/boot/ 2>/dev/null || echo "no boot dir"
          ls arch/arm64/boot/dts/vendor/qcom/*.dtb 2>/dev/null | head -5 || echo "no dtb glob"

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/vendor/qcom/*.dtb
            arch/arm64/boot/kernel_config.txt
            build.log
          if-no-files-found: warn
