name: build-lineage-kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply custom patches
        run: |
          ls patches/
          for p in patches/*.patch; do
            echo "=== applying $p ==="
            git apply --verbose "$p" || { echo "PATCH FAILED: $p"; exit 1; }
          done
          git diff --stat | tail -5

      - name: Setup GCC toolchain (aarch64, Ubuntu)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - name: Build kernel (lahaina-qgki, GCC)
        run: |
          set -o pipefail
          # Fix EVERY trace header that defines TRACE_INCLUDE_PATH '.' (breaks GCC/clang):
          # revert to default trace/events path, then symlink each header into include/trace/events/
          mkdir -p include/trace/events
          for f in $(find drivers kernel net sound fs arch include -name '*.h' 2>/dev/null); do
            if grep -q '^#define TRACE_INCLUDE_PATH[[:space:]]*\.' "$f" 2>/dev/null; then
              sed -i 's/^#define TRACE_INCLUDE_PATH[[:space:]]*\.$/#undef TRACE_INCLUDE_PATH/' "$f"
            fi
            name=$(grep -m1 '^#define TRACE_INCLUDE_FILE[[:space:]]*[A-Za-z0-9_]' "$f" 2>/dev/null | sed -E 's/^#define TRACE_INCLUDE_FILE[[:space:]]+([A-Za-z0-9_]+).*/\1/' || true)
            if [ -n "$name" ]; then
              ln -sf "$PWD/$f" "include/trace/events/$name.h" 2>/dev/null || true
            fi
          done
          ln -sf $PWD/kernel/sched/walt/trace.h include/trace/events/trace.h 2>/dev/null || true
          export KCFLAGS="-Wno-error"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/lahaina-qgki_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz dtbs 2>&1 | tee build.log
          echo "--- build outputs ---"
          ls -la arch/arm64/boot/ 2>/dev/null || echo "no boot dir"

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/vendor/qcom/*.dtb
            build.log
          if-no-files-found: warn
