name: build-lineage-kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply custom patches
        run: |
          ls patches/
          for p in patches/*.patch; do
            echo "=== applying $p ==="
            git apply --verbose "$p" || { echo "PATCH FAILED: $p"; exit 1; }
          done
          git diff --stat | tail -5

      - name: Setup GCC toolchain (aarch64, Ubuntu)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - name: Build kernel (lahaina-qgki, GCC)
        run: |
          set -o pipefail
          # Trace include fixes for GCC (no quote-include fallback to source dir):
          # - headers with TRACE_INCLUDE_PATH '.' resolve as ./<file>.h from include/trace/.
          #   If their TRACE_INCLUDE_FILE is the generic 'trace' (regmap/mac80211/... all collide
          #   on include/trace/trace.h), rename it to a unique name based on their dir.
          # - headers WITHOUT TRACE_INCLUDE_PATH resolve as <trace/events/<file>.h> -> symlink into events/.
          mkdir -p include/trace/events
          for f in $(find drivers kernel net sound fs arch include -name '*.h' 2>/dev/null); do
            if grep -q '^#define TRACE_INCLUDE_PATH[[:space:]]*\.' "$f" 2>/dev/null; then
              old=$(grep -m1 '^#define TRACE_INCLUDE_FILE[[:space:]]*[A-Za-z0-9_-]' "$f" 2>/dev/null | sed -E 's/^#define TRACE_INCLUDE_FILE[[:space:]]+([A-Za-z0-9_-]+).*/\1/' || true)
              if [ "$old" = "trace" ]; then
                sub=$(basename "$(dirname "$f")")
                sed -i "s/^#define TRACE_INCLUDE_FILE[[:space:]]*trace$/#define TRACE_INCLUDE_FILE $sub/" "$f"
                ln -sf "$PWD/$f" "include/trace/$sub.h" 2>/dev/null || true
              elif [ -n "$old" ]; then
                ln -sf "$PWD/$f" "include/trace/$old.h" 2>/dev/null || true
              fi
            elif grep -q '^#define TRACE_INCLUDE_FILE[[:space:]]*[A-Za-z0-9_-]' "$f" 2>/dev/null && ! grep -q '^#define TRACE_INCLUDE_PATH' "$f" 2>/dev/null; then
              name=$(grep -m1 '^#define TRACE_INCLUDE_FILE[[:space:]]*[A-Za-z0-9_-]' "$f" 2>/dev/null | sed -E 's/^#define TRACE_INCLUDE_FILE[[:space:]]+([A-Za-z0-9_-]+).*/\1/' || true)
              if [ -n "$name" ]; then
                ln -sf "$PWD/$f" "include/trace/events/$name.h" 2>/dev/null || true
              fi
            fi
          done
          # Remove -Werror everywhere (GCC 9 on 2019 kernel: many -Werror=* fire; KCFLAGS=-Wno-error
          # is overridden because -Werror is appended after KCFLAGS in the build flags)
          grep -rl -- '-Werror' --include='Makefile*' . 2>/dev/null | xargs sed -i 's/-Werror//g' 2>/dev/null || true
          export KCFLAGS="-Wno-error"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/lahaina-qgki_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image.gz dtbs 2>&1 | tee build.log
          echo "--- build outputs ---"
          ls -la arch/arm64/boot/ 2>/dev/null || echo "no boot dir"

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/vendor/qcom/*.dtb
            build.log
          if-no-files-found: warn
