name: build-lineage-kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply custom patches
        run: |
          ls patches/
          for p in patches/*.patch; do
            echo "=== applying $p ==="
            git apply --verbose "$p" || { echo "PATCH FAILED: $p"; exit 1; }
          done
          git diff --stat | tail -5

      - name: Setup GCC toolchain (aarch64, LineageOS prebuilt)
        run: |
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc
          ls gcc/bin/ | head -5
          gcc/bin/aarch64-linux-android-gcc --version | head -1

      - name: Build kernel (lahaina-qgki, GCC)
        run: |
          make ARCH=arm64 CROSS_COMPILE=$PWD/gcc/bin/aarch64-linux-android- vendor/lahaina-qgki_defconfig
          make ARCH=arm64 CROSS_COMPILE=$PWD/gcc/bin/aarch64-linux-android- -j$(nproc) Image.gz dtbs 2>&1 | tee build.log
          echo "--- build outputs ---"
          ls -la arch/arm64/boot/ 2>/dev/null || echo "no boot dir"

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/vendor/qcom/*.dtb
            build.log
          if-no-files-found: warn
